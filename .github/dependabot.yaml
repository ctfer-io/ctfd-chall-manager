version: 2
updates:
  # Github actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "NicoFgrx"
    groups:
      # init/autobuild/analyze must stay on the same version or CodeQL errors out
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Github actions for reusable
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows/setup-testing"
    schedule:
      interval: "weekly"
    assignees:
      - "NicoFgrx"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "NicoFgrx"
